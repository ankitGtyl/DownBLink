<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFA0" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1713" />
      <stop offset="50%" stop-color="#0A0E0C" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#darkBg)" stroke="#00FF87" stroke-opacity="0.35" stroke-width="6" />

  <!-- Background Cyber Accent Gridlines -->
  <path d="M 60 160 L 452 160 M 60 352 L 452 352 M 160 60 L 160 452 M 352 60 L 352 452" stroke="#00FF87" stroke-opacity="0.04" stroke-width="2" />

  <!-- Outer Neon Pulse Glow Path -->
  <rect x="28" y="28" width="456" height="456" rx="98" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.2" />

  <!-- DBL Monogram & Download Arrow Architecture -->
  <g filter="url(#glowFilter)">
    <!-- 'D' Geometric Curve -->
    <path d="M 96 140 L 156 140 C 200 140 220 165 220 205 C 220 240 198 262 160 265 L 140 265 L 140 372 L 96 372 Z M 140 180 L 140 226 L 156 226 C 172 226 180 216 180 203 C 180 190 172 180 156 180 Z" 
          fill="url(#neonGlow)" />

    <!-- Center 'B' & Dynamic Download Arrow Integration -->
    <path d="M 236 140 L 296 140 C 330 140 348 156 348 182 C 348 200 338 212 322 218 C 342 225 354 240 354 266 C 354 296 330 316 292 316 L 274 316 L 274 278 L 290 278 C 304 278 312 270 312 258 C 312 246 304 238 288 238 L 274 238 L 274 212 L 288 212 C 300 212 308 204 308 194 C 308 184 300 176 288 176 L 274 176 L 274 372 L 236 372 Z" 
          fill="url(#neonGlow)" />

    <!-- 'L' Right Arm -->
    <path d="M 368 140 L 412 140 L 412 332 L 444 332 L 444 372 L 368 372 Z" 
          fill="url(#neonGlow)" />

    <!-- Central Glowing Download Arrow Chevron that cuts through -->
    <g transform="translate(256, 350)">
      <polygon points="0,48 -34,-6 -14,-6 -14,-46 14,-46 14,-6 34,-6" fill="#00FF87" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Interactive Play Node in 'D' Core -->
  <polygon points="152,195 152,213 168,204" fill="#050807" />

  <!-- Glowing Accent Dots / Connection Nodes -->
  <circle cx="96" cy="140" r="6" fill="#FFFFFF" />
  <circle cx="444" cy="372" r="6" fill="#FFFFFF" />
  <circle cx="256" cy="398" r="4" fill="#FFFFFF" />
</svg>
